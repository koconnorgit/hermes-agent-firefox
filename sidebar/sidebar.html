<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Agent</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Nous<span class="dot"></span>Hermes</span>
    <span class="bar-right">
      <span id="waiting" class="waiting" title="Another session has a reply waiting" hidden>● response waiting</span>
      <span id="status" class="status status--unknown" title="connection status">checking…</span>
      <button type="button" id="settings" class="icon-btn bar-btn" title="Settings">⚙</button>
      <button type="button" id="popout" class="icon-btn bar-btn" title="Pop out">⧉</button>
    </span>
  </header>

  <div class="toolbar">
    <select id="session-select" class="session-select" title="Switch chat session">
      <option value="">＋ New chat</option>
    </select>
    <button type="button" id="session-pin" class="icon-btn pin-btn" title="Pin this chat to the top" aria-pressed="false" disabled>📌</button>
    <button type="button" id="session-refresh" class="icon-btn" title="Refresh sessions + reload this transcript">⟳</button>
    <button type="button" id="open-web" class="icon-btn" title="Open this chat in the Hermes dashboard">↗</button>
  </div>

  <main id="log" class="log" aria-live="polite"></main>

  <div id="context-chip" class="chip" hidden>
    <span id="context-label" class="chip__label"></span>
    <button id="context-clear" class="chip__x" title="Drop page context" aria-label="Drop page context">×</button>
  </div>

  <form id="composer" class="composer">
    <button type="button" id="new-chat" class="icon-btn" title="Start a new chat" aria-label="Start a new chat">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="M7 2.25v9.5M2.25 7h9.5"/>
      </svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M13.25 4.25v5a1.5 1.5 0 0 1-1.5 1.5H7.5l-2.75 2.5v-2.5h-.5a1.5 1.5 0 0 1-1.5-1.5v-5a1.5 1.5 0 0 1 1.5-1.5h7.5a1.5 1.5 0 0 1 1.5 1.5Z"/>
      </svg>
    </button>
    <button type="button" id="attach" class="icon-btn" title="Attach current page context" aria-label="Attach current page context">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M9.5 1.75H4.25a1.5 1.5 0 0 0-1.5 1.5v9.5a1.5 1.5 0 0 0 1.5 1.5h7.5a1.5 1.5 0 0 0 1.5-1.5V5.75Z"/>
        <path d="M9.5 1.75v4h3.75"/>
      </svg>
    </button>
    <textarea id="input" class="input" rows="1" placeholder="Message Hermes…" autocomplete="off"></textarea>
    <button type="submit" id="send" class="send">Send</button>
  </form>

  <!-- config.js defines the global HERMES config; markdown.js the message
       renderer (HERMES_MD); sidebar.js drives the UI. -->
  <script src="../config.js"></script>
  <script src="markdown.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
